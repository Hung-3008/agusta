# =====================================================================
# BrainFlow Large — Anti-Overfit Warm-Restart (A1)
# Warmstart from outputs/brainflow_dit_large_80/best.pt
# =====================================================================

data_root: Data

fmri:
  dir: algonauts_2025.competitors/fmri
  n_voxels: 1000
  excluded_samples_start: 5
  excluded_samples_end: 5
  hrf_delay: 2
  use_global_stats: true

context_latent_dirs:
  - Data/features_npy_pooled/vjepa2_avg_feat
  - Data/features_npy_pooled/whisper
  - Data/features_npy_pooled/Llama-3.2-1B
  - Data/features_npy_pooled/Llama-3.2-3B
  - Data/features_npy_pooled/qwen2-5_3B
  - Data/features_npy_pooled/qwen-2-5-omni-7b
  - Data/features_npy_pooled/internvl3_8b_8bit
  - Data/features_npy_pooled/InternVL3_14B
  - Data/features_npy_pooled/dinov2_giant
  - Data/features_npy_pooled/vlm2vec_7b

modality_dims:
  - 1408
  - 1280
  - 2048
  - 3072
  - 2048
  - 3584
  - 3584
  - 5120
  - 6144
  - 3584

subjects:
  - sub-01
  - sub-02
  - sub-03
  - sub-05

splits:
  friends:
    train: [s1, s2, s3, s4, s5]
    val: [s6]
  movie10:
    train: [bourne, figures, life, wolf]
    val: []

sliding_window:
  context_trs: 101
  n_target_trs: 50
  stride: 10
  temporal_jitter: 2

dataloader:
  batch_size: 64
  val_batch_size: 64
  num_workers: 0
  pin_memory: true

model_version: v6

brainflow:
  output_dim: 1000

  indi_flow_matching: true
  indi_train_time_sqrt: false
  indi_min_denom: 1.0e-3
  use_csfm: true
  flow_loss_weight: 1.0
  csfm_var_reg_weight: 0.2          # ↑ 0.1 → 0.2 (mild extra regularization on source variance)
  csfm_pcc_weight: 1.0
  train_cfg_drop_rate: 0.15         # ↑ 0.1 → 0.15 (encoder sees more unconditional examples for CFG infer)

  velocity_net:
    hidden_dim: 1024
    dit_num_blocks: 24
    n_heads: 16
    dropout: 0.15                   # ↑ 0.1 → 0.15
    modality_dropout: 0.15          # ↑ 0.0 → 0.15 (NEW key — drops random modalities at train)
    stochastic_depth_rate: 0.1      # ↑ 0   → 0.1  (NEW key — DropPath inside DiT blocks)
    context_trs: 101
    n_target_trs: 50
    temporal_attn_layers: 4
    gradient_checkpointing: true
    use_subject_head: true
    network_head: true
    use_rope: true
    latent_dim: 1024
    context_encoder: multitoken
    use_dit_decoder: true
    decoder_type: ditx
    zero_init_network_heads: true
    proj_dim: 256
    n_blocks: 4
    max_seq_len: 101
    fusion_mode: concat
    fusion_proj_dim: 512

solver_args:
  method: midpoint
  time_points: 50                   # ↑ 30 → 50 (finer ODE grid)
  cfg_scale: 1.5                    # ↑ 0   → 1.5 (classifier-free guidance at infer)
  temperature: 0.05
  time_grid_warp: sqrt
  tta_temperatures: [0.0, 0.05, 0.1, 0.15]   # NEW — TTA average over 4 temperatures

training:
  n_epochs: 50                      # ↓ 200 → 50 (schedule sized for fine-tune)
  lr: 3.0e-5                        # ↓ 1e-4 → 3e-5
  weight_decay: 0.1                 # ↑ 0.05 → 0.1
  warmup_ratio: 0.02                # ↓ 0.05 → 0.02 (short warmup since warmstarted)
  min_lr: 1.0e-7                    # ↓ 1e-6 → 1e-7 (let cosine anneal further)
  grad_clip: 1.0
  use_amp: true
  log_every_n_steps: 20
  val_every_n_epochs: 5             # ↓ 10 → 5 (more frequent val for shorter run)
  ema_decay: 0.9995                 # ↑ 0.999 → 0.9995 (smoother tail)
  gradient_accumulation_steps: 8
  ema_on_cpu: true
  context_bf16_when_amp: true
  empty_cuda_cache_each_epoch: false

output_dir: outputs/brainflow_dit_large_restart
