# =====================================================================
# BrainFlow Medium Capacity Config
# =====================================================================

data_root: Data



context_latent_dirs:
  - Data/features_npy_pooled_v2/vjepa2_avg_feat
  - Data/features_npy_pooled_v2/Llama-3.2-1B
  - Data/features_npy_pooled_v2/Llama-3.2-3B
  - Data/features_npy_pooled_v2/qwen2-5_3B
  - Data/features_npy_pooled_v2/internvl3_8b_8bit
  - Data/features_npy_pooled_v2/InternVL3_14B
  - Data/features_npy_pooled_v2/dinov2_giant
  - Data/features_npy_pooled_v2/vlm2vec_7b

modality_dims:
  - 1408
  - 2048
  - 3072
  - 2048
  - 3584
  - 5120
  - 1536   # v2: DINOv2 CLS last layer only (was 6144)
  - 3072   # v2: VLM2Vec Phi-3.5-Vision hidden_size (was 3584)

subjects:
  - sub-01
  - sub-02
  - sub-03
  - sub-04
  - sub-05
  - sub-06
  - sub-07
  - sub-08
  - sub-09
  - sub-10

bmd:
  target_mode: roi_subset_grouped
  rep_mode: per_rep

dataloader:
  batch_size: 64
  val_batch_size: 256
  num_workers: 0
  pin_memory: true

model_version: v6

brainflow:
  output_dim: 8335

  indi_flow_matching: false
  indi_train_time_sqrt: false
  indi_min_denom: 1.0e-3
  use_csfm: true
  flow_loss_weight: 1.0
  csfm_var_reg_weight: 0.3
  csfm_pcc_weight: 1.5

  velocity_net:
    hidden_dim: 768
    dit_num_blocks: 12
    n_heads: 12
    dropout: 0.1
    context_trs: 1
    n_target_trs: 1
    temporal_attn_layers: 4
    bmd_mode: true
    gradient_checkpointing: true
    use_subject_head: true
    network_head: true
    use_rope: true
    latent_dim: 768
    context_encoder: multitoken
    use_dit_decoder: true
    decoder_type: dit1d
    zero_init_network_heads: false
    modality_dropout: 0.1
    max_seq_len: 101
    fusion_mode: concat        # v2: simpler mean fusion (was concat)
    fusion_proj_dim: 384      # ignored in mean mode

solver_args:
  method: midpoint
  time_points: 15
  cfg_scale: 0.0
  temperature: 0.02
  time_grid_warp: sqrt

training:
  n_epochs: 150
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_ratio: 0.05
  min_lr: 1.0e-6
  grad_clip: 1.0
  use_amp: true
  log_every_n_steps: 20
  val_every_n_epochs: 10
  ema_decay: 0.999
  gradient_accumulation_steps: 8
  ema_on_cpu: true
  context_bf16_when_amp: true
  empty_cuda_cache_each_epoch: false
  cfg_dropout: 0.0
  freeze_epoch: 100

output_dir: outputs/brainflow_bmd_csfm_concat
