# =====================================================================
# Ablation: U-DiT 1D Backbone (Table — Decoder backbone comparison)
# "U-shaped multi-scale DiT with skip connections"
#
# This config implements the U-DiT backbone adapted for 1D sequences
# (Tian et al., NeurIPS 2024). The key architectural ideas:
#   - Multi-scale encoder → latent → decoder with skip connections
#   - Token downsampling: T→T/2→T/4 reduces attention cost
#   - Per-level adaLN time conditioning with channel scaling
#   - Sparse cross-attention in decoder levels for context injection
#
# Architecture:
#   Encoder: same as DiT-L (multitoken fusion, RoPE temporal encoder)
#   Decoder: U-DiT-1D (512-dim base, [1,2,4] channel mults)
#     Level 1: 512-dim, 2+2 blocks (enc+dec), T=50 tokens
#     Level 2: 1024-dim, 4+4 blocks, T=25 tokens
#     Latent:  2048-dim, 6 blocks, T=12 tokens
#     Skip connections between matching encoder/decoder levels
#     Cross-attention every 2 blocks in decoder levels
#     Total: 18 blocks across 5 levels
#
# Usage:
#   python src/train_brainflow.py \
#       --config src/configs/table_decoder/udit_backbone.yaml
# =====================================================================

data_root: Data

fmri:
  dir: algonauts_2025.competitors/fmri
  n_voxels: 1000
  excluded_samples_start: 5
  excluded_samples_end: 5
  hrf_delay: 2
  use_global_stats: true

context_latent_dirs:
  - Data/features_npy_pooled/vjepa2_avg_feat
  - Data/features_npy_pooled/whisper
  - Data/features_npy_pooled/Llama-3.2-1B
  - Data/features_npy_pooled/Llama-3.2-3B
  - Data/features_npy_pooled/qwen2-5_3B
  - Data/features_npy_pooled/qwen-2-5-omni-7b
  - Data/features_npy_pooled/internvl3_8b_8bit
  - Data/features_npy_pooled/InternVL3_14B
  - Data/features_npy_pooled/dinov2_giant
  - Data/features_npy_pooled/vlm2vec_7b

modality_dims:
  - 1408
  - 1280
  - 2048
  - 3072
  - 2048
  - 3584
  - 3584
  - 5120
  - 6144
  - 3584

# Ablation setting: single subject only (sub-01)
subjects:
  - sub-01

splits:
  friends:
    train: [s1, s2, s3, s4, s5]
    val: [s6]
  movie10:
    train: [bourne, figures, life, wolf]
    val: []

sliding_window:
  context_trs: 101
  n_target_trs: 50
  stride: 10
  temporal_jitter: 2

dataloader:
  batch_size: 64
  val_batch_size: 64
  num_workers: 0
  pin_memory: true

model_version: v6

brainflow:
  output_dim: 1000
  use_csfm: true
  csfm_var_reg_weight: 0.1
  csfm_pcc_weight: 1.0
  indi_flow_matching: false
  indi_train_time_sqrt: false
  indi_min_denom: 1.0e-3
  flow_loss_weight: 1.0

  velocity_net:
    # Encoder: shared across all Table decoder ablation rows
    hidden_dim: 512
    dit_num_blocks: 18           # total blocks (informational; udit_depth controls per-level)
    n_heads: 16
    dropout: 0.1
    context_trs: 101
    n_target_trs: 50
    temporal_attn_layers: 4
    gradient_checkpointing: true
    use_subject_head: true
    network_head: true
    use_rope: true
    latent_dim: 512
    context_encoder: multitoken
    use_dit_decoder: true
    # ---- U-DiT 1D backbone ----
    decoder_type: udit
    udit_depth: [2, 4, 6, 4, 2]           # [enc1, enc2, latent, dec2, dec1]
    udit_channel_mult: [1, 2, 4]           # channel multipliers [lvl1, lvl2, latent]
    cross_attn_every_n: 2                  # cross-attention at even-numbered decoder blocks
    stochastic_depth_rate: 0.0             # no stochastic depth for fair comparison
    zero_init_network_heads: true
    proj_dim: 256
    n_blocks: 4
    modality_dropout: 0.0
    max_seq_len: 101
    fusion_mode: concat
    fusion_proj_dim: 512

solver_args:
  method: midpoint
  time_points: 30
  cfg_scale: 0.0
  temperature: 0.0
  time_grid_warp: sqrt

training:
  n_epochs: 80
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_ratio: 0.05
  min_lr: 1.0e-6
  grad_clip: 1.0
  use_amp: true
  log_every_n_steps: 20
  val_every_n_epochs: 10
  ema_decay: 0.999
  gradient_accumulation_steps: 8
  ema_on_cpu: true
  context_bf16_when_amp: true
  empty_cuda_cache_each_epoch: false

output_dir: outputs/ablation_decoder_udit
