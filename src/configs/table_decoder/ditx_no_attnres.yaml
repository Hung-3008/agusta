# =====================================================================
# Ablation: DiT-X without Attention Residuals (Table 4, Row 3)
# "Decoder backbone — Effect of cross-attention and sub-layer Attention Residuals"
#
# This config implements DiT-X (cross-attention at every block) but with
# standard additive residuals instead of sub-layer Attention Residuals.
# Uses DiTHybridBackbone with cross_attn_every_n=1 so every block has
# cross-attention, SwiGLU FFN, and RoPE — identical to DiT-X except
# the AttnRes operators are replaced by identity skips.
#
# Architecture:
#   Encoder: same as DiT-L (multitoken fusion, RoPE temporal encoder)
#   Decoder: 24 × DiTHybridBlock (Self-Attn + Cross-Attn + SwiGLU, 1024-dim)
#            cross_attn_every_n=1 → cross-attention at ALL blocks
#            NO AttnRes → standard h_{l+1} = h_l + f_l(h_l) residuals
#
# Counterparts (Table 4):
#   MLP (8-layer):            decoder_type: mlp
#   DiT (no cross-attn):      decoder_type: dit1d
#   DiT-X + AttnRes (ours):   decoder_type: ditx (full config)
#
# Usage:
#   python src/train_brainflow.py \
#       --config src/configs/table4_decoder/ditx_no_attnres.yaml
# =====================================================================

data_root: Data

fmri:
  dir: algonauts_2025.competitors/fmri
  n_voxels: 1000
  excluded_samples_start: 5
  excluded_samples_end: 5
  hrf_delay: 2
  use_global_stats: true

context_latent_dirs:
  - Data/features_npy_pooled/vjepa2_avg_feat
  - Data/features_npy_pooled/whisper
  - Data/features_npy_pooled/Llama-3.2-1B
  - Data/features_npy_pooled/Llama-3.2-3B
  - Data/features_npy_pooled/qwen2-5_3B
  - Data/features_npy_pooled/qwen-2-5-omni-7b
  - Data/features_npy_pooled/internvl3_8b_8bit
  - Data/features_npy_pooled/InternVL3_14B
  - Data/features_npy_pooled/dinov2_giant
  - Data/features_npy_pooled/vlm2vec_7b

modality_dims:
  - 1408
  - 1280
  - 2048
  - 3072
  - 2048
  - 3584
  - 3584
  - 5120
  - 6144
  - 3584

# Ablation setting: single subject only (sub-01)
subjects:
  - sub-01

splits:
  friends:
    train: [s1, s2, s3, s4, s5]
    val: [s6]
  movie10:
    train: [bourne, figures, life, wolf]
    val: []

sliding_window:
  context_trs: 101
  n_target_trs: 50
  stride: 10
  temporal_jitter: 2

dataloader:
  batch_size: 64
  val_batch_size: 64
  num_workers: 0
  pin_memory: true

model_version: v6

brainflow:
  output_dim: 1000
  use_csfm: true
  csfm_var_reg_weight: 0.1
  csfm_pcc_weight: 1.0
  indi_flow_matching: false
  indi_train_time_sqrt: false
  indi_min_denom: 1.0e-3
  flow_loss_weight: 1.0

  velocity_net:
    # Encoder: DiT-L dimensions (1024-dim, 16-head) — shared across all Table 4 rows
    hidden_dim: 1024
    dit_num_blocks: 24
    n_heads: 16
    dropout: 0.1
    context_trs: 101
    n_target_trs: 50
    temporal_attn_layers: 4
    gradient_checkpointing: true
    use_subject_head: true
    network_head: true
    use_rope: true
    latent_dim: 1024
    context_encoder: multitoken
    use_dit_decoder: true
    # ---- DiT-X without AttnRes: DiTHybrid with cross-attn at every block ----
    decoder_type: dit_hybrid
    cross_attn_every_n: 1            # cross-attention at ALL 24 blocks
    stochastic_depth_rate: 0.0       # no stochastic depth for fair comparison
    zero_init_network_heads: true
    proj_dim: 256
    n_blocks: 4
    modality_dropout: 0.0
    max_seq_len: 101
    fusion_mode: concat
    fusion_proj_dim: 512

solver_args:
  method: midpoint
  time_points: 30
  cfg_scale: 0.0
  temperature: 0.0
  time_grid_warp: sqrt

training:
  n_epochs: 80
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_ratio: 0.05
  min_lr: 1.0e-6
  grad_clip: 1.0
  use_amp: true
  log_every_n_steps: 20
  val_every_n_epochs: 10
  ema_decay: 0.999
  gradient_accumulation_steps: 8
  ema_on_cpu: true
  context_bf16_when_amp: true
  empty_cuda_cache_each_epoch: false

output_dir: outputs/ablation_decoder_ditx_no_attnres
